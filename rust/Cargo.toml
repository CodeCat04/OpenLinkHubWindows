[package]
name = "openlinkhub"
version = "0.1.0"
edition = "2021"
description = "Windows port of OpenLinkHub for Corsair iCUE LINK hubs"
license = "GPL-3.0-or-later"
repository = "https://github.com/CodeCat04/OpenLinkHubWindows"

[[bin]]
name = "OpenLinkHub"
path = "src/main.rs"

[dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }
ctrlc = "3"
log = "0.4"
rand = "0.8"
tray-icon = "0.26.1"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
