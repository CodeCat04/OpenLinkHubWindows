name: Windows

# Checks that every push and pull request tests, lints and builds, including the installer.
# Nothing is published: people build OpenLinkHub themselves (see README).
on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Clippy
        run: cargo clippy --locked --release --all-targets -- -D warnings

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Test and build (exe + installer)
        shell: pwsh
        run: ./build.ps1 -RequireInstaller
