<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenLinkHub</title>
<style>
:root {
  --bg: #0f1013; --panel: #17191e; --panel-2: #1e2128; --line: #2a2e37;
  --text: #e9eaee; --muted: #9097a5; --accent: #ffc400; --accent-ink: #1a1400;
  --ok: #3ccf8e; --warn: #ffb020; --bad: #ff5d5d; --fan: #4ea8ff; --pump: #ff7a45;
  --radius: 10px; color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f0f1f4; --line: #dfe2e8;
    --text: #15171c; --muted: #5d6573; --accent: #e0a800; --accent-ink: #1a1400; color-scheme: light; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; margin-right: auto; }
.brand svg { width: 26px; height: 26px; }
.presets { display: flex; align-items: center; gap: 8px; }
.presets > span { color: var(--muted); font-size: 12.5px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
.seg button:hover { color: var(--text); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button:disabled { cursor: default; opacity: .5; }
.presets .custom { font-size: 12px; }
.presets select { font-size: 13px; padding: 4px 8px; }
.presets select.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.presets select option { background: var(--panel-2); color: var(--text); font-weight: 400; }
.fanpop { position: relative; }
.fanbtn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12.5px; cursor: pointer; }
.fanbtn svg { width: 15px; height: 15px; color: var(--fan); }
.fanbtn:hover, .fanpop.open .fanbtn { color: var(--text); border-color: var(--muted); }
.fanpop.pinned .fanbtn { border-color: var(--accent); }
.fanlist { display: none; position: absolute; right: 0; top: 100%; padding-top: 6px; z-index: 20; }
.fanpop.open .fanlist { display: block; }
.fanlist .panel { width: 360px; max-height: 70vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 8px 12px 10px; }
.fanlist .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.fanlist .top b { font-size: 13px; }
.fanlist h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 10px 0 2px; font-weight: 600; }
.fanrow { display: grid; grid-template-columns: 1fr auto 56px 34px; gap: 10px; align-items: center; padding: 3px 0; font-size: 13px; font-variant-numeric: tabular-nums; }
.fanrow .rpm, .fanrow .pct { text-align: right; }
.fanrow .pct { color: var(--muted); font-size: 12px; }
.fanrow .meter { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.fanrow .meter i { display: block; height: 100%; background: var(--fan); }
.fanrow.pump .meter i { background: var(--pump); }
.fanrow .kind { color: var(--muted); font-size: 11.5px; margin-left: 4px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.chip b { color: var(--text); font-weight: 600; }
nav { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
nav button { background: none; border: 0; color: var(--muted); padding: 9px 12px; border-bottom: 2px solid transparent; cursor: pointer; font: inherit; }
nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
.banner { border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--panel); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
.banner.bad { border-left-color: var(--bad); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 18px; }
.card-head { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 15px; margin: 0; margin-right: auto; }
.card-head .sub { color: var(--muted); font-weight: 400; font-size: 12.5px; margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
label.inline { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; }
select, input[type=text], input[type=number], input[type=url] { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; font: inherit; min-width: 0; }
select:focus, input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 0; }
input[type=range] { accent-color: var(--accent); width: 120px; }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
input[type=color] { width: 34px; height: 26px; border: 1px solid var(--line); border-radius: 6px; background: none; padding: 1px; cursor: pointer; }
button.btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; font: inherit; cursor: pointer; }
button.btn:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
.devices { display: grid; }
.dev { display: grid; grid-template-columns: minmax(170px, 1.3fr) minmax(190px, 1.2fr) minmax(150px, 1fr) minmax(150px, 1fr) auto; gap: 10px 14px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.dev:first-child { border-top: 0; }
.dev.sub { background: color-mix(in srgb, var(--panel-2) 45%, transparent); padding-top: 6px; padding-bottom: 6px; }
.dev.sub .name { font-weight: 500; }
.dev .name { font-weight: 600; }
.dev .label { color: var(--muted); font-size: 12.5px; cursor: text; border-bottom: 1px dashed transparent; }
.dev .label:hover { border-bottom-color: var(--muted); }
.stats { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.stat small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.duty { height: 4px; background: var(--panel-2); border-radius: 2px; margin-top: 4px; overflow: hidden; width: 70px; }
.duty i { display: block; height: 100%; background: var(--fan); transition: width .4s; }
.dev select { width: 100%; }
.swatch { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
.swatch.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.override { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--panel-2); border-radius: 8px; padding: 8px 12px; }
.empty { color: var(--muted); padding: 30px 14px; text-align: center; }
.split { display: grid; grid-template-columns: 240px 1fr; gap: 18px; }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; align-self: start; }
.list button { display: flex; width: 100%; justify-content: space-between; gap: 8px; text-align: left; background: none; border: 0; color: var(--text); padding: 7px 9px; border-radius: 6px; cursor: pointer; font: inherit; }
.list button[aria-current="true"] { background: var(--panel-2); }
.badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
.editor { padding: 14px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; margin-bottom: 14px; }
.form label { display: grid; gap: 4px; color: var(--muted); font-size: 12.5px; }
.chart { width: 100%; height: auto; display: block; background: var(--panel-2); border-radius: 8px; touch-action: none; user-select: none; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .grid { stroke: var(--line); }
.chart circle { cursor: grab; }
.legend { display: flex; gap: 16px; align-items: center; color: var(--muted); font-size: 12.5px; margin: 8px 0 12px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 12.5px; }
pre.logs { background: var(--panel-2); border-radius: 8px; padding: 10px; max-height: 360px; overflow: auto; font: 12px/1.5 Consolas, ui-monospace, monospace; white-space: pre-wrap; margin: 0; }
.settings { display: grid; gap: 12px; padding: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.35); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.toast.err { border-color: var(--bad); }
[hidden] { display: none !important; }
@media (max-width: 860px) {
  .dev { grid-template-columns: 1fr 1fr; }
  .dev > :first-child { grid-column: 1 / -1; }
  .split { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#ffc400"/><circle cx="16" cy="16" r="12" fill="#18181c"/><g fill="#fafafa"><path d="M16 16 C 14 9, 18 6, 21 7 C 20 11, 18 14, 16 16Z"/><path d="M16 16 C 23 15, 26 19, 24.5 22 C 21 20.5, 18 18, 16 16Z"/><path d="M16 16 C 17 23, 13 26, 10 24.5 C 11.5 21, 14 18, 16 16Z"/><path d="M16 16 C 9 17, 6 13, 7.5 10 C 11 11.5, 14 14, 16 16Z"/></g><circle cx="16" cy="16" r="3" fill="#ffc400"/></svg>
      OpenLinkHub
    </div>
    <div class="presets" id="presets" role="radiogroup" aria-labelledby="presets-label"></div>
    <div class="chips" id="chips"></div>
    <div class="fanpop" id="fanpop">
      <button class="chip fanbtn" id="fanbtn" aria-expanded="false" aria-controls="fanlist"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><g fill="currentColor" opacity=".85"><path d="M12 9.6C11 5.5 12.6 2.8 15 3.2c.6 2.6-.8 5-3 6.4Z"/><path d="M14.4 12c4.1-1 6.8.6 6.4 3-2.6.6-5-.8-6.4-3Z"/><path d="M12 14.4c1 4.1-.6 6.8-3 6.4-.6-2.6.8-5 3-6.4Z"/><path d="M9.6 12C5.5 13 2.8 11.4 3.2 9c2.6-.6 5 .8 6.4 3Z"/></g></svg><b id="fanavg">—</b></button>
      <div class="fanlist" id="fanlist"><div class="panel" role="region" aria-label="Fan speeds">
        <div class="top"><b>Fan speeds</b><span class="hint" id="fanpin"></span></div>
        <div id="fanlist-body"></div>
      </div></div>
    </div>
  </div>
  <nav role="tablist">
    <button role="tab" data-tab="devices" aria-selected="true">Devices</button>
    <button role="tab" data-tab="curves">Fan curves</button>
    <button role="tab" data-tab="lighting">Lighting</button>
    <button role="tab" data-tab="settings">Settings</button>
  </nav>
</header>

<main>
  <section id="tab-devices">
    <div id="banners"></div>
    <div id="hubs"></div>
  </section>

  <section id="tab-curves" hidden>
    <div class="split">
      <div class="list" id="curve-list"></div>
      <div class="card editor" id="curve-editor"></div>
    </div>
  </section>

  <section id="tab-lighting" hidden>
    <div class="split">
      <div class="list" id="rgb-list"></div>
      <div class="card editor" id="rgb-editor"></div>
    </div>
  </section>

  <section id="tab-settings" hidden>
    <div class="card"><div class="card-head"><h2>Settings</h2></div><div class="settings" id="settings"></div></div>
    <div class="card"><div class="card-head"><h2>Log</h2><button class="btn" id="refresh-logs">Refresh</button></div><div class="settings"><pre class="logs" id="logs"></pre></div></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const SENSORS = { 0: "CPU", 1: "GPU", 2: "Liquid (AIO coolant)", 4: "Temperature probe", 5: "CPU + GPU (max)", 10: "PSU" };
const RGB_NAMES = { arc: "Arc", circle: "Circle", circleshift: "Circle Shift", colorpulse: "Color Pulse", colorshift: "Color Shift", colorwarp: "Color Warp",
  "cpu-temperature": "CPU Temperature", flickering: "Flickering", "gpu-temperature": "GPU Temperature", gradient: "Gradient", "liquid-temperature": "Liquid Temperature",
  marquee: "Marquee", nebula: "Nebula", off: "Off", "probe-temperature": "Probe Temperature", rain: "Rain", rainbow: "Rainbow", pastelrainbow: "Pastel Rainbow",
  rotarystack: "Rotary Stack", rotator: "Rotator", sequential: "Sequential", spinner: "Spinner", spiralrainbow: "Spiral Rainbow",
  pastelspiralrainbow: "Pastel Spiral Rainbow", static: "Static", storm: "Storm", watercolor: "Watercolor", wave: "Wave" };
const TEMP_MODES = ["cpu-temperature", "gpu-temperature", "liquid-temperature", "probe-temperature"];

let state = null;
let structure = "";
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
};
const shortSerial = s => "••••" + String(s).slice(-4);
const fmtTemp = t => t > 0 ? t.toFixed(1) + " °C" : "—";

function toast(msg, err = false) {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "toast", err ? 4000 : 1600);
}

async function api(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-OpenLinkHub": "1" }, body: JSON.stringify(body || {}) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || r.statusText);
    return true;
  } catch (e) { toast(e.message, true); return false; }
}

// ---------------------------------------------------------------- tabs
for (const b of document.querySelectorAll("nav button")) {
  b.addEventListener("click", () => {
    for (const o of document.querySelectorAll("nav button")) o.setAttribute("aria-selected", o === b);
    for (const s of document.querySelectorAll("main > section")) s.hidden = s.id !== "tab-" + b.dataset.tab;
    if (b.dataset.tab === "settings") loadLogs();
    history.replaceState(null, "", "#" + b.dataset.tab);
    try { localStorage.setItem("tab", b.dataset.tab); } catch {}
  });
}
{
  let t = location.hash.slice(1);
  if (!t) try { t = localStorage.getItem("tab"); } catch {}
  if (t) $(`nav button[data-tab="${CSS.escape(t)}"]`)?.click();
}

// ---------------------------------------------------------------- polling
async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    state = await r.json();
    render();
  } catch {
    $("#chips").replaceChildren(el("span", { class: "chip" }, "OpenLinkHub is not running"));
  }
  setTimeout(poll, 1000);
}

function render() {
  renderPresets();
  renderFans();
  renderChips();
  renderBanners();
  const sig = JSON.stringify([state.hubs.map(h => [h.serial, h.devices.map(d => [d.channelId, d.name, d.ledChannels, d.adapter, !!d.lcd])]),
    Object.keys(state.speedProfiles), state.rgbModes, state.profile]);
  if (sig !== structure) { structure = sig; buildHubs(); renderCurveList(); renderRgbList(); renderSettings(); }
  updateHubs();
  updateCurveMarker();
}

// Profiles: each puts every fan (not pumps) on one curve and remembers its own lighting. Quiet, Normal and
// Performance always exist; curves made on the Fan curves tab are custom profiles in the dropdown.
const PROFILE_HINT = "Switches every fan's curve (pumps keep theirs) and the lighting saved with the profile. Lighting changes are saved to the active profile.";
let presetBusy = false;
function renderPresets() {
  const box = $("#presets");
  const hasFans = state.hubs.some(h => h.devices.some(d => d.hasSpeed && !d.containsPump && !d.isPsu));
  if (!box.firstChild) {
    box.append(el("span", { id: "presets-label" }, "Profile"),
      el("div", { class: "seg" }, state.fanPresets.map(name => el("button", { role: "radio", "data-preset": name, onclick: () => setPreset(name) }, name))),
      el("select", { "aria-label": "Custom profiles", title: "Custom profiles (make one on the Fan curves tab)", onchange: e => e.target.value && setPreset(e.target.value) }),
      el("span", { class: "custom hint" }));
  }
  const off = !state.hubs.length || presetBusy;
  for (const b of box.querySelectorAll("button")) {
    b.setAttribute("aria-checked", b.dataset.preset === state.profile);
    b.disabled = off;
  }
  const sel = box.querySelector("select");
  const customs = state.customProfiles;
  const key = JSON.stringify(customs);
  if (sel.dataset.key !== key && document.activeElement !== sel) {
    sel.dataset.key = key;
    sel.replaceChildren(el("option", { value: "", disabled: true }, "Custom…"), ...customs.map(n => el("option", { value: n }, n)));
  }
  const isCustom = customs.includes(state.profile);
  const want = isCustom ? state.profile : "";
  if (sel.value !== want) sel.value = want;
  sel.classList.toggle("on", isCustom);
  sel.hidden = !customs.length;
  sel.disabled = off;
  const customFans = hasFans && state.profile && state.fanCurve !== state.profile;
  const custom = box.querySelector(".custom");
  custom.textContent = customFans ? "Custom fans" : "";
  custom.title = customFans ? `Some fans aren't on the ${state.profile} curve. Click ${state.profile} to reset them.` : "";
  box.title = state.hubs.length ? PROFILE_HINT : "No iCUE LINK hub connected";
}
async function setPreset(name) {
  if (presetBusy || (name === state.profile && state.fanCurve === name)) return;
  presetBusy = true; state.profile = name; renderPresets();
  if (await api("/api/profile", { name })) toast("Profile: " + name);
  presetBusy = false;
  const r = await fetch("/api/state", { cache: "no-store" }).catch(() => null);
  if (r) { state = await r.json(); render(); }
}

// Fan speeds button (top right): opens while hovered, click pins it open.
let fansPinned = false;
try { fansPinned = localStorage.getItem("fansPinned") === "1"; } catch {}
{
  const pop = $("#fanpop"), btn = $("#fanbtn");
  let hover = false;
  const sync = () => {
    const open = fansPinned || hover;
    pop.classList.toggle("open", open);
    pop.classList.toggle("pinned", fansPinned);
    btn.setAttribute("aria-expanded", open);
    btn.title = fansPinned ? "Fan speeds (pinned open, click to unpin)" : "Fan speeds (click to keep open)";
    $("#fanpin").textContent = fansPinned ? "Pinned · click the button to unpin" : "Click the button to keep open";
  };
  const pin = on => { fansPinned = on; try { localStorage.setItem("fansPinned", on ? "1" : "0"); } catch {} sync(); };
  pop.addEventListener("mouseenter", () => { hover = true; sync(); });
  pop.addEventListener("mouseleave", () => { hover = false; sync(); });
  btn.addEventListener("click", () => pin(!fansPinned));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && fansPinned) pin(false); });
  sync();
}

function renderFans() {
  const isFan = d => d.hasSpeed && !d.containsPump && !d.isPsu;
  const fans = state.hubs.flatMap(h => h.devices.filter(isFan));
  $("#fanavg").textContent = fans.length ? Math.round(fans.reduce((a, d) => a + d.rpm, 0) / fans.length) + " rpm" : "No fans";
  $("#fanbtn").setAttribute("aria-label", "Fan speeds, average " + $("#fanavg").textContent);
  const groups = state.hubs.map(h => {
    const devs = h.devices.filter(d => isFan(d) || d.containsPump);
    const total = {}, seen = {};
    for (const d of devs) total[d.name] = (total[d.name] || 0) + 1;
    const rows = devs.map(d => {
      seen[d.name] = (seen[d.name] || 0) + 1;
      const base = d.name.replace(/^iCUE LINK /, "");
      const name = d.label || (total[d.name] > 1 ? `${base} ${seen[d.name]}` : base);
      const pump = d.containsPump;
      return el("div", { class: "fanrow" + (pump ? " pump" : "") },
        el("span", {}, name, pump ? el("span", { class: "kind" }, "pump") : null),
        el("span", { class: "rpm" }, d.rpm > 0 ? d.rpm + " rpm" : "stopped"),
        el("span", { class: "meter", title: `${d.duty}% duty` }, el("i", { style: `width:${d.duty}%` })),
        el("span", { class: "pct" }, d.duty + "%"));
    });
    return rows.length ? [el("h3", {}, `Hub ${shortSerial(h.serial)} · ${devs.length} device${devs.length === 1 ? "" : "s"}`), ...rows] : [];
  }).flat();
  $("#fanlist-body").replaceChildren(...(groups.length ? groups : [el("p", { class: "hint" }, "No fans found.")]));
}

function renderChips() {
  const s = state.sensors;
  const chips = [
    el("span", { class: "chip", title: s.cpuStatus === "ok" ? "From the OpenLinkHub Sensors service" : "CPU temperature sensor: " + s.cpuStatus }, "CPU ", el("b", {}, fmtTemp(s.cpu))),

function buildDevice(h, d) {

  const labelEl = el("div", { class: "label", title: "Click to rename", tabindex: 0 }, d.label || "Add label");
  const editLabel = () => {
    const inp = el("input", { type: "text", value: d.label || "", maxlength: 32, placeholder: "e.g. Top exhaust" });
    const done = async save => {
      if (save) { await api("/api/hub/label", { serial: h.serial, channel: d.channelId, label: inp.value }); d.label = inp.value.trim(); }
      labelEl.textContent = d.label || "Add label"; inp.replaceWith(labelEl);
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); });
    inp.addEventListener("blur", () => done(true));
    labelEl.replaceWith(inp); inp.focus();
  };
  labelEl.addEventListener("click", editLabel);
  labelEl.addEventListener("keydown", e => { if (e.key === "Enter") editLabel(); });

  const speedSel = canSpeed

The hub's LED ports restart briefly. Make sure this matches what is physically connected.`)) {

        else e.target.value = d.adapter;
      } }, state.linkAdapters.map(a => el("option", { value: a.index, selected: a.index === d.adapter }, a.index === 0 ? "Nothing connected" : a.name)))
    : d.ledChannels > 0
    ? el("select", { "data-k": "rgb", "aria-label": "Lighting effect", onchange: e => api("/api/hub/rgb", { serial: h.serial, channels: [d.channelId], profile: e.target.value }) }, rgbOptions(d.rgbProfile))
    : el("span", { class: "hint" }, "No lighting");

  const row = el("div", { class: "dev", "data-ch": d.channelId });
  const ov = buildOverride(h, d);
  const lcdPanel = d.lcd ? buildLcd(h, d) : null;
  const swatch = d.ledChannels > 0 ? el("button", { class: "swatch" + (d.rgbOverride.enabled ? " on" : ""), title: "Custom colors for this device", "aria-label": "Custom colors", onclick: () => ov.hidden = !ov.hidden }) : el("span");
  row.append(...[
    el("div", {}, el("div", { class: "name" }, d.name), labelEl),

      el("div", { class: "stat" }, el("small", {}, d.aio ? "Coolant" : "Temp"), el("span", { "data-k": "temp" })),
      d.isPsu ? el("div", { class: "stat" }, el("small", {}, "Power"), el("span", { "data-k": "power" })) : null),
    speedSel, rgbSel,
    el("div", { class: "row", style: "gap:6px;flex-wrap:nowrap" }, swatch,
      lcdPanel ? el("button", { class: "btn", title: `${d.lcd.product} screen`, onclick: () => lcdPanel.hidden = !lcdPanel.hidden }, "LCD") : null),
    ov, lcdPanel].filter(Boolean));
  return row;
}

// Screen settings for a pump with an LCD cap / XD5 / XC7 display.
function buildLcd(h, d) {
  const st = { ...d.lcd.settings };
  const save = () => api("/api/hub/lcd", { serial: h.serial, channel: d.channelId, settings: st }).then(ok => ok && toast("Screen updated"));

function hexOf(c) { return "#" + [c.red, c.green, c.blue].map(v => Math.max(0, Math.min(255, Math.round(v || 0))).toString(16).padStart(2, "0")).join(""); }
function colorOf(hex, base = {}) { const n = parseInt(hex.slice(1), 16); return { ...base, red: n >> 16 & 255, green: n >> 8 & 255, blue: n & 255, brightness: 1 }; }

function buildOverride(h, d) {
  const o = structuredClone(d.rgbOverride);
  if (!o.start || (!o.start.red && !o.start.green && !o.start.blue)) o.start = { red: 0, green: 255, blue: 255, brightness: 1 };
  if (!o.end || (!o.end.red && !o.end.green && !o.end.blue)) o.end = { red: 255, green: 0, blue: 255, brightness: 1 };
  if (!o.middle) o.middle = { red: 255, green: 255, blue: 255, brightness: 1 };
  if (!o.speed) o.speed = 4;
  const save = () => api("/api/hub/override", { serial: h.serial, channel: d.channelId, override: o }).then(ok => ok && toast(o.enabled ? "Custom colors on" : "Custom colors off"));
  const en = el("input", { type: "checkbox", onchange: e => { o.enabled = e.target.checked; save(); } }); en.checked = !!o.enabled;
  const picker = key => el("input", { type: "color", value: hexOf(o[key]), onchange: e => { o[key] = colorOf(e.target.value); if (o.enabled) save(); } });
  return el("div", { class: "override", hidden: true },
    el("label", { class: "inline" }, en, "Use custom colors"),
    el("label", { class: "inline" }, "Start", picker("start")),
    el("label", { class: "inline" }, "Middle", picker("middle")),
    el("label", { class: "inline" }, "End", picker("end")),
    el("label", { class: "inline" }, "Speed", el("input", { type: "range", min: 0.1, max: 10, step: 0.1, value: o.speed, onchange: e => { o.speed = +e.target.value; if (o.enabled) save(); } })),
    el("span", { class: "hint" }, "Static uses the start color. Animated effects blend start → end."));
}

function updateHubs() {
  for (const h of state.hubs) {
    const card = $(`.card[data-serial="${CSS.escape(h.serial)}"]`);

      const rg = $('[data-k="rgb"]', row); if (rg && document.activeElement !== rg) rg.value = d.rgbProfile;
      for (const part of d.subDevices || []) {

      $(".swatch", row)?.classList.toggle("on", !!d.rgbOverride.enabled);

// ---------------------------------------------------------------- fan curves
let curveName = "Normal";
let curveDraft = null;
let activeCurve = 1;

function renderCurveList() {
  const list = $("#curve-list");
  list.replaceChildren(...Object.entries(state.speedProfiles).map(([name, p]) =>
    el("button", { "aria-current": name === curveName, onclick: () => { curveName = name; curveDraft = null; renderCurveList(); } },
      el("span", {}, name), el("span", { class: "badge" }, p.builtin ? (p.modified ? "edited" : "built-in") : SENSORS[p.sensor]?.split(" ")[0] || "")) ),
    el("div", { style: "padding:6px" }, el("button", { class: "btn", style: "width:100%", onclick: () => newCurve() }, "+ New curve")));
  renderCurveEditor();
}

function newCurve() {
  let n = 1; while (state.speedProfiles["Custom " + n]) n++;
  curveName = null;
  curveDraft = { name: "Custom " + n, sensor: 2, zeroRpm: false, channelId: 0, device: "",
    points: { 0: [{ x: 25, y: 50 }, { x: 35, y: 70 }, { x: 45, y: 100 }], 1: [{ x: 25, y: 30 }, { x: 35, y: 50 }, { x: 45, y: 100 }] } };
  renderCurveList();
}

function draft() {
  if (!curveDraft) {
    const p = state.speedProfiles[curveName];
    if (!p) { curveName = "Normal"; return draft(); }
    curveDraft = { name: curveName, ...structuredClone(p) };
  }
  return curveDraft;
}

function currentSensorTemp(p) {
  const s = state.sensors;
  switch (p.sensor) {
    case 0: return s.cpu; case 1: return s.gpu || s.cpu; case 5: return Math.max(s.cpu, s.gpu);
    case 2: { for (const h of state.hubs) { const a = h.devices.find(d => d.aio || d.containsPump); if (a) return a.temperature; } return 0; }
    case 10: { for (const h of state.hubs) { const a = h.devices.find(d => d.isPsu); if (a) return a.temperature; } return 0; }
    case 4: { const h = state.hubs.find(h => h.serial === p.device) || state.hubs[0]; return h?.devices.find(d => d.channelId === p.channelId)?.temperature || 0; }
  }
  return 0;
}

function renderCurveEditor() {
  const p = draft();
  const builtin = !!(curveName && state.speedProfiles[curveName]?.builtin);
  const modified = builtin && !!state.speedProfiles[curveName]?.modified;
  const root = $("#curve-editor");
  const sensorSel = el("select", { onchange: e => { p.sensor = +e.target.value; renderCurveEditor(); } },
    Object.entries(SENSORS).map(([v, n]) => el("option", { value: v, selected: +v === p.sensor }, n)));
  const extra = [];
  if (p.sensor === 4) {
    const probes = state.hubs.flatMap(h => h.devices.filter(d => d.isProbe).map(d => ({ h, d })));
    extra.push(el("label", {}, "Probe", el("select", { onchange: e => { const [s, c] = e.target.value.split("|"); p.device = s; p.channelId = +c; } },
      probes.length ? probes.map(({ h, d }) => el("option", { value: `${h.serial}|${d.channelId}`, selected: p.device === h.serial && p.channelId === d.channelId }, `${d.label || d.name} (${shortSerial(h.serial)})`))
        : el("option", {}, "No probes found"))));
    if (probes.length && !p.device) { p.device = probes[0].h.serial; p.channelId = probes[0].d.channelId; }
  }
  const zero = el("input", { type: "checkbox", onchange: e => p.zeroRpm = e.target.checked }); zero.checked = !!p.zeroRpm;
  const nameInp = el("input", { type: "text", value: p.name, maxlength: 64 });

  const curveTabs = el("div", { class: "legend" },
    el("label", { class: "inline" }, el("input", { type: "radio", name: "curve", checked: activeCurve === 1, onchange: () => { activeCurve = 1; drawChart(); } }), el("i", { style: "background:var(--fan)" }), "Fans"),
    el("label", { class: "inline" }, el("input", { type: "radio", name: "curve", checked: activeCurve === 0, onchange: () => { activeCurve = 0; drawChart(); } }), el("i", { style: "background:var(--pump)" }), "Pump"),
    el("span", { class: "hint", id: "curve-now" }),
    el("span", { class: "hint" }, "Drag points · click empty space to add · double-click a point to remove"));

  const save = async () => {
    const name = nameInp.value.trim();
    const body = { sensor: p.sensor, zeroRpm: !!p.zeroRpm, points: p.points, channelId: p.channelId || 0, device: p.device || "" };
    const isNew = !state.speedProfiles[name];
    if (await api("/api/speedProfile", { name, profile: body })) {
      toast(isNew ? `Curve saved. “${name}” is now a custom profile too` : "Curve saved");
      curveName = name; curveDraft = null; structure = "";
    }
  };
  const reset = async () => {
    if (!confirm(`Put “${curveName}” back to its default curve? Lighting saved with the profile isn't changed.`)) return;
    if (await api("/api/speedProfile/reset", { name: curveName })) { toast("Curve reset to default"); curveDraft = null; structure = ""; }
  };
  const del = async () => {
    if (!confirm(`Delete curve “${curveName}”?`)) return;
    if (await api("/api/speedProfile/delete", { name: curveName })) { toast("Curve deleted"); curveName = "Normal"; curveDraft = null; structure = ""; }
  };

  root.replaceChildren(
    el("div", { class: "form" },
      el("label", {}, "Name", nameInp),
      el("label", {}, "Follows sensor", sensorSel),
      ...extra,
      el("label", {}, "Allow fans to stop", el("span", { class: "row" }, zero, el("span", { class: "hint" }, "Zero RPM below the first point")))),
    curveTabs,
    el("div", { id: "chart-wrap" }),
    el("div", { class: "actions", style: "margin-top:12px" },
      el("button", { class: "btn primary", onclick: save }, "Save"),
      modified ? el("button", { class: "btn", onclick: reset }, "Reset to default") : null,
      !builtin && curveName ? el("button", { class: "btn danger", onclick: del }, "Delete") : null,
      el("span", { class: "hint" }, builtin
        ? "Built-in curve: edit it freely, it can't be deleted, and Reset to default puts it back. Rename it to save a copy instead. "
        : "Custom curves are also profiles: pick them from the Profile dropdown at the top or the tray menu. "),
      el("span", { class: "hint" }, "Pump duty never drops below 50% on AIOs (31% on TITAN) and fans never below 20% unless zero RPM is on — the same safety floors as upstream.")));
  drawChart();
}

const CH = { w: 720, h: 320, l: 44, r: 14, t: 14, b: 34, tMax: 100 };
const sx = t => CH.l + t / CH.tMax * (CH.w - CH.l - CH.r);
const sy = d => CH.t + (1 - d / 100) * (CH.h - CH.t - CH.b);

function drawChart() {
  const wrap = $("#chart-wrap"); if (!wrap) return;
  const p = draft();
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, a = {}) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
  const svg = s("svg", { viewBox: `0 0 ${CH.w} ${CH.h}`, class: "chart", role: "img", "aria-label": "Fan curve" });
  for (let t = 0; t <= CH.tMax; t += 10) {
    svg.append(s("line", { x1: sx(t), x2: sx(t), y1: CH.t, y2: CH.h - CH.b, class: "grid" }));
    const tx = s("text", { x: sx(t), y: CH.h - 12, "text-anchor": "middle" }); tx.textContent = t + "°"; svg.append(tx);
  }
  for (let d = 0; d <= 100; d += 20) {
    svg.append(s("line", { x1: CH.l, x2: CH.w - CH.r, y1: sy(d), y2: sy(d), class: "grid" }));
    const tx = s("text", { x: CH.l - 8, y: sy(d) + 4, "text-anchor": "end" }); tx.textContent = d + "%"; svg.append(tx);
  }
  const marker = s("line", { id: "curve-marker", y1: CH.t, y2: CH.h - CH.b, stroke: "var(--accent)", "stroke-dasharray": "4 4", "stroke-width": 1.5 });
  svg.append(marker);

  for (const which of [0, 1]) {
    const pts = (p.points[which] || []).slice().sort((a, b) => a.x - b.x);
    const color = which === 1 ? "var(--fan)" : "var(--pump)";
    const active = which === activeCurve;
    const ext = [{ x: 0, y: pts[0]?.y ?? 0 }, ...pts, { x: CH.tMax, y: pts[pts.length - 1]?.y ?? 0 }];
    svg.append(s("polyline", { points: ext.map(q => `${sx(Math.min(q.x, CH.tMax))},${sy(q.y)}`).join(" "), fill: "none", stroke: color, "stroke-width": active ? 2.5 : 1.5, opacity: active ? 1 : .45 }));
    if (!active) continue;
    pts.forEach(pt => {
      const c = s("circle", { cx: sx(Math.min(pt.x, CH.tMax)), cy: sy(pt.y), r: 7, fill: color, stroke: "var(--panel)", "stroke-width": 2 });
      const tip = s("title"); tip.textContent = `${pt.x.toFixed(0)} °C → ${pt.y.toFixed(0)}%`; c.append(tip);
      c.addEventListener("pointerdown", ev => {
        ev.preventDefault(); c.setPointerCapture(ev.pointerId);
        const move = e => {
          const r = svg.getBoundingClientRect(), k = CH.w / r.width;
          pt.x = Math.round(Math.max(0, Math.min(CH.tMax, ((e.clientX - r.left) * k - CH.l) / (CH.w - CH.l - CH.r) * CH.tMax)));
          pt.y = Math.round(Math.max(0, Math.min(100, (1 - ((e.clientY - r.top) * k - CH.t) / (CH.h - CH.t - CH.b)) * 100)));
          p.points[which] = pts; drawChart();
        };
        c.addEventListener("pointermove", move);
        c.addEventListener("pointerup", () => c.removeEventListener("pointermove", move), { once: true });
      });
      c.addEventListener("dblclick", ev => { ev.stopPropagation(); if (pts.length > 1) { pts.splice(pts.indexOf(pt), 1); p.points[which] = pts; drawChart(); } });
      svg.append(c);
    });
  }
  svg.addEventListener("click", ev => {
    if (ev.target.tagName === "circle") return;
    const r = svg.getBoundingClientRect(), k = CH.w / r.width;
    const x = Math.round(((ev.clientX - r.left) * k - CH.l) / (CH.w - CH.l - CH.r) * CH.tMax);
    const y = Math.round((1 - ((ev.clientY - r.top) * k - CH.t) / (CH.h - CH.t - CH.b)) * 100);
    if (x < 0 || x > CH.tMax || y < 0 || y > 100) return;
    (p.points[activeCurve] ||= []).push({ x, y }); drawChart();
  });
  wrap.replaceChildren(svg);
  updateCurveMarker();
}

function updateCurveMarker() {
  const m = $("#curve-marker"); if (!m || !curveDraft && !curveName) return;
  const t = currentSensorTemp(draft());
  m.setAttribute("x1", sx(Math.min(t, CH.tMax))); m.setAttribute("x2", sx(Math.min(t, CH.tMax)));
  m.style.display = t > 0 ? "" : "none";
  const now = $("#curve-now"); if (now) now.textContent = t > 0 ? `Now: ${t.toFixed(1)} °C` : "Sensor not available";
}

// ---------------------------------------------------------------- lighting
let rgbName = "static";
function renderRgbList() {
  $("#rgb-list").replaceChildren(...state.rgbModes.filter(m => m !== "off").map(m =>
    el("button", { "aria-current": m === rgbName, onclick: () => { rgbName = m; renderRgbList(); } }, el("span", {}, RGB_NAMES[m] || m))));
  renderRgbEditor();
}

function renderRgbEditor() {
  const p = structuredClone(state.rgbProfiles[rgbName] || {});
  for (const k of ["start", "middle", "end"]) p[k] ||= { red: 0, green: 0, blue: 0, brightness: 1 };
  const picker = k => el("input", { type: "color", value: hexOf(p[k]), onchange: e => p[k] = colorOf(e.target.value, p[k]) });
  const isTemp = TEMP_MODES.includes(rgbName);
  const isStatic = rgbName === "static";
  const hasColors = !["rainbow", "pastelrainbow", "spiralrainbow", "pastelspiralrainbow", "gradient"].includes(rgbName);
  const speed = el("input", { type: "range", min: 0.1, max: 10, step: 0.1, value: p.speed || 4, oninput: e => { p.speed = +e.target.value; speedTxt.textContent = p.speed + " s"; } });
  const speedTxt = el("span", { class: "hint" }, (p.speed || 4) + " s");
  const num = (k, label) => el("label", {}, label, el("input", { type: "number", min: 0, max: 120, value: p[k] ?? 0, onchange: e => p[k] = +e.target.value }));
  const save = async () => { if (await api("/api/rgbProfile", { name: rgbName, profile: p })) { toast("Effect saved"); } };
  const colorNote = "Leaving the start or end color black makes non-temperature effects use random colors.";
  $("#rgb-editor").replaceChildren(...[
    el("h2", { style: "margin:0 0 4px;font-size:16px" }, RGB_NAMES[rgbName] || rgbName),
    el("p", { class: "hint", style: "margin:0 0 14px" }, "Settings here apply to every device using this effect" + (state.profile ? ` and are saved with the ${state.profile} profile` : "") + ". For per-device colors, use the color swatch on the Devices tab."),
    el("div", { class: "form" },
      isTemp || isStatic ? null : el("label", {}, "Cycle time", el("span", { class: "row" }, speed, speedTxt)),
      hasColors ? el("label", {}, isTemp ? "Cold color" : isStatic ? "Color" : "Start color", picker("start")) : null,
      hasColors && (isTemp || ["colorshift", "colorwarp"].includes(rgbName)) ? el("label", {}, isTemp ? "Warm color" : "Middle color", picker("middle")) : null,
      hasColors && !isStatic ? el("label", {}, isTemp ? "Hot color" : "End color", picker("end")) : null,
      isTemp && rgbName !== "probe-temperature" ? num("minTemp", "Cold at (°C)") : null,
      isTemp && rgbName !== "probe-temperature" ? num("maxTemp", "Hot at (°C)") : null),
    hasColors && !isTemp && !isStatic ? el("p", { class: "hint" }, colorNote) : null,
    el("div", { class: "actions" }, el("button", { class: "btn primary", onclick: save }, "Save"))].filter(Boolean));
}

// ---------------------------------------------------------------- settings
function renderSettings() {
  const s = state.settings;
  const toggle = (key, label, hint) => {
    const c = el("input", { type: "checkbox", onchange: async e => { if (await api("/api/settings", { [key]: e.target.checked })) toast("Saved"); } });
    c.checked = !!s[key];
    return el("div", {}, el("label", { class: "inline", style: "color:var(--text)" }, c, label), hint ? el("div", { class: "hint", style: "margin-left:24px" }, hint) : null);
  };
  $("#settings").replaceChildren(
    toggle("autostart", "Start with Windows", "Runs in the tray at sign-in. No administrator rights needed."),
    toggle("openDashboard", "Open this dashboard when OpenLinkHub is started from the Start menu"),
    el("div", {},
      el("div", { style: "margin-bottom:6px" }, "CPU temperature sensor ", el("span", { class: "hint" }, "· " + state.sensors.cpuStatus)),
      el("div", { class: "hint" }, state.sensors.cpuStatus === "ok"
        ? "Provided by the OpenLinkHub Sensors service through the PawnIO driver."
        : "Windows only lets kernel drivers read CPU temperature. Install the PawnIO driver from an administrator PowerShell with “winget install namazso.PawnIO”, then run the OpenLinkHub installer again with “CPU temperature sensor” ticked. See the README for details.")),
    el("div", {},
      el("div", { style: "margin-bottom:6px" }, "GPU temperature ", el("span", { class: "hint" }, state.sensors.nvidia ? "· NVIDIA GPU detected" : "· no NVIDIA GPU detected")),
      el("div", { class: "hint" }, "Read from the NVIDIA driver. Other GPUs aren't supported; GPU-based curves then follow the CPU temperature.")),
    el("div", { class: "hint" }, `Settings and profiles are stored in ${s.dataDir}. ${s.installed ? "Installed for this user — uninstall from Settings → Apps." : "Running without installing."}`),
    el("div", { class: "actions" }, el("button", { class: "btn danger", onclick: async () => {
      if (confirm("Quit OpenLinkHub? Lighting and fans return to the hub's built-in (hardware) mode.") && await api("/api/quit")) {
        document.body.replaceChildren(el("div", { class: "empty" }, "OpenLinkHub is stopping…"));
      }
    } }, "Quit OpenLinkHub")),
    el("div", { class: "hint" }, `Version ${state.version} · Runs entirely offline: no network access of any kind. · `,
      el("a", { href: "https://github.com/CodeCat04/OpenLinkHubWindows", target: "_blank", rel: "noopener noreferrer" }, "Source code & help")));
}

async function loadLogs() {
  try { const r = await fetch("/api/logs", { cache: "no-store" }); const lines = await r.json(); const pre = $("#logs"); pre.textContent = lines.join("\n"); pre.scrollTop = pre.scrollHeight; } catch {}
}
$("#refresh-logs").addEventListener("click", loadLogs);

poll();
</script>
</body>
</html>
