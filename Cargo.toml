[package]
name = "openlinkhub"
version = "0.1.0"
edition = "2021"
description = "Windows port of OpenLinkHub for Corsair iCUE LINK hubs"
license = "GPL-3.0-or-later"
repository = "https://github.com/CodeCat04/OpenLinkHubWindows"

[[bin]]
name = "OpenLinkHub"
path = "src/main.rs"

# CPU temperature service (runs as SYSTEM; see sensors/main.rs).
[[bin]]
name = "OpenLinkHubSensors"
path = "sensors/main.rs"

[dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
log = "0.4"
rand = "0.8"
tray-icon = "0.26.1"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemInformation", "Win32_System_LibraryLoader"] }
windows-service = "0.8.1"
wry = "0.57.0"
tao = "0.37.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp", "webp", "gif"] }
ab_glyph = "0.2.32"
jpeg-encoder = "0.7.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
